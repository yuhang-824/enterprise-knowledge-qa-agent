[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-qa-agent"
version = "0.1.0"
description = "Evidence-grounded enterprise QA with conflict checks and exact citations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
knowledge-qa = "knowledge_qa.cli:main"
knowledge-qa-web = "knowledge_qa.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_qa = ["web_assets/*"]
